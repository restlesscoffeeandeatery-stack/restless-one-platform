  <script>
    var AIO_WORKER_URL=((document.querySelector('meta[name="restless-worker-url"]')||{}).content||'').replace(/\/$/,'');
    var AIO_ADMIN_KEY=(document.querySelector('meta[name="restless-admin-key"]')||{}).content||new URLSearchParams(location.search).get('adminKey')||'';
    function aioRun(){
      if(!AIO_WORKER_URL)return google.script.run;
      var success=function(){},failure=function(){},runner;
      runner=new Proxy({
        withSuccessHandler:function(fn){success=typeof fn==='function'?fn:success;return runner;},
        withFailureHandler:function(fn){failure=typeof fn==='function'?fn:failure;return runner;}
      },{get:function(target,name){if(name in target)return target[name];return function(){var args=Array.prototype.slice.call(arguments);fetch(AIO_WORKER_URL+'/rpc',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8','X-Restless-Admin-Key':AIO_ADMIN_KEY},body:JSON.stringify({fn:String(name),args:args,adminKey:AIO_ADMIN_KEY}),cache:'no-store',credentials:'omit'}).then(function(response){return response.json();}).then(function(result){if(!result.ok)throw new Error(result.error||'Cloudflare Worker gagal.');success(result.data);}).catch(failure);return runner;};}});
      return runner;
    }

    var state={data:{transactions:[],categories:[],invoices:[],budgets:[],accounts:[],allocationRules:[]},page:'dashboard',transactionType:'Pengeluaran',lastFocus:null,deferredInstall:null,hasCache:false,allocationPreview:null,syncInFlight:false,invoiceFilters:{q:'',from:'',to:'',showPaid:false}};
    var titles={dashboard:['Keuangan hari ini','Ringkasan'],accounts:['Pemisahan dana','Rekening & alokasi'],transactions:['Arus kas','Transaksi'],invoices:['Tagihan & pembayaran','Invoice'],budgets:['Rencana masa depan','Target budget'],categories:['Pengaturan data','Kategori']};
    document.addEventListener('DOMContentLoaded',function(){bindBase();initPwa();bootApp();});
    function bindBase(){
      document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-page]');if(b)switchPage(b.dataset.page);});
      document.getElementById('refreshBtn').addEventListener('click',function(){loadData(false);});
      document.getElementById('installBtn').addEventListener('click',installApp);
      document.getElementById('quickBtn').addEventListener('click',openTransactionModal);
      document.getElementById('modalRoot').addEventListener('click',function(e){if(e.target.id==='modalRoot'||e.target.closest('[data-close]'))closeModal();});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();if(e.key==='Tab')trapModalFocus(e);});
    }
    function bootApp(){var cached=readCache();if(cached){state.data=normalizeAppData(cached);state.hasCache=true;renderAll();setLoading(false);setSyncStatus('syncing','Memperbarui data…');loadData(true);}else{loadData(false);}}
    function loadData(silent,attempt){attempt=attempt||0;if(state.syncInFlight)return;state.syncInFlight=true;if(!silent)setLoading(true);setSyncStatus('syncing',attempt?'Mencoba sinkronisasi kembali…':'Menyinkronkan…');aioRun().withSuccessHandler(function(response){state.syncInFlight=false;var data;try{data=JSON.parse(response);}catch(err){handleSyncFailure({message:'Respons server tidak valid.'},silent,attempt);return;}if(!data||typeof data!=='object'){handleSyncFailure({message:'Server tidak mengirim data yang valid.'},silent,attempt);return;}state.data=normalizeAppData(data);state.hasCache=true;writeCache(state.data);renderAll();setLoading(false);setSyncStatus('online','Data terbaru');}).withFailureHandler(function(err){state.syncInFlight=false;handleSyncFailure(err,silent,attempt);}).getAppDataJson();}

    function openCategoryModal(){openModal('<div class="modal-head"><h2>Tambah kategori</h2><button class="close" data-close aria-label="Tutup">×</button></div><form id="categoryForm"><div class="modal-body"><div class="form-grid"><div class="field"><label for="catType">Tipe</label><select class="control" id="catType"><option>Pemasukan</option><option>Pengeluaran</option></select></div><div class="field"><label for="catParent">Kategori induk</label><select class="control" id="catParent"></select></div><div class="field span-2"><label for="catAccount">Rekening pembayaran</label><select class="control" id="catAccount">'+accountOptions('ACC-UTAMA')+'</select></div><div class="field span-2"><label for="catName">Nama kategori / subkategori</label><input class="control" id="catName" required placeholder="Contoh: Iklan Instagram"></div><div class="span-2" style="color:var(--muted);font-size:13px">Pilih “Kategori utama” untuk membuat kategori induk baru.</div></div></div><div class="modal-foot"><button class="btn btn-secondary" type="button" data-close>Batal</button><button class="btn btn-primary">Tambah kategori</button></div></form>');updateParentCategoryOptions();document.getElementById('catType').onchange=updateParentCategoryOptions;document.getElementById('categoryForm').onsubmit=function(e){e.preventDefault();setModalBusy(true);aioRun().withSuccessHandler(saved('Kategori ditambahkan.')).withFailureHandler(onError).saveCategory({type:val('catType'),name:val('catName'),parent:val('catParent'),accountId:val('catAccount')});};}
    function updateParentCategoryOptions(){var type=val('catType'),parents=state.data.categories.filter(function(c){return c.type===type&&c.active&&!c.parent;});document.getElementById('catParent').innerHTML='<option value="">Kategori utama</option>'+parents.map(function(c){return'<option>'+esc(c.name)+'</option>';}).join('');}
    function toggleCategory(id,active){setLoading(true);aioRun().withSuccessHandler(saved(active?'Kategori diaktifkan.':'Kategori dinonaktifkan.')).withFailureHandler(onError).setCategoryActive(id,active);}
    function openAllocationModal(){var main=(state.data.accounts||[]).find(function(a){return a.id==='ACC-UTAMA';})||{balance:0};state.allocationPreview=null;openModal('<div class="modal-head"><h2>Alokasikan pemasukan</h2><button class="close" data-close aria-label="Tutup">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="allocationAmount">Dana dari Rekening Utama</label><input class="control" id="allocationAmount" inputmode="numeric" value="'+numberFormat(Math.max(0,main.balance))+'"></div><div class="field"><label for="allocationPeriod">Periode</label><input class="control" id="allocationPeriod" type="month" value="'+attr(state.data.allocationPeriod||'')+'"></div><div class="span-2" id="allocationPreview"><p class="muted">Tekan “Lihat pembagian” untuk memeriksa alokasi sebelum disimpan.</p></div></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Batal</button><button type="button" class="btn btn-secondary" id="previewAllocation">Lihat pembagian</button><button type="button" class="btn btn-primary" id="confirmAllocation" disabled>Konfirmasi alokasi</button></div>');bindMoney(document.getElementById('allocationAmount'));document.getElementById('previewAllocation').onclick=previewAllocation;document.getElementById('confirmAllocation').onclick=confirmAllocation;}
    function previewAllocation(){var amount=rawMoney(val('allocationAmount')),period=val('allocationPeriod'),button=document.getElementById('previewAllocation');button.disabled=true;button.textContent='Menghitung…';aioRun().withSuccessHandler(function(preview){state.allocationPreview=preview;button.disabled=false;button.textContent='Hitung ulang';document.getElementById('allocationPreview').innerHTML='<div class="allocation-preview"><strong>Preview pembagian</strong>'+preview.items.map(function(item){return'<div class="preview-row"><span>'+esc(item.accountName)+'</span><strong>'+money(item.amount)+'</strong></div>';}).join('')+(preview.unallocated?'<div class="preview-row negative"><span>Belum dialokasikan</span><strong>'+money(preview.unallocated)+'</strong></div>':'')+'</div>';document.getElementById('confirmAllocation').disabled=!preview.items.length;}).withFailureHandler(function(err){button.disabled=false;button.textContent='Lihat pembagian';onError(err);}).getAllocationPreview(amount,period);}
    function confirmAllocation(){if(!state.allocationPreview)return;setModalBusy(true);aioRun().withSuccessHandler(saved('Dana berhasil dialokasikan ke rekening tujuan.')).withFailureHandler(onError).commitAllocation({amount:state.allocationPreview.amount,period:state.allocationPreview.period});}
    function openTransferModal(){var options=accountOptions('');openModal('<div class="modal-head"><h2>Transfer antar rekening</h2><button class="close" data-close aria-label="Tutup">×</button></div><form id="transferForm"><div class="modal-body"><div class="form-grid"><div class="field"><label for="transferSource">Rekening asal</label><select class="control" id="transferSource">'+options+'</select></div><div class="field"><label for="transferDestination">Rekening tujuan</label><select class="control" id="transferDestination">'+options+'</select></div><div class="field span-2"><label for="transferAmount">Nominal</label><input class="control" id="transferAmount" inputmode="numeric" required></div><div class="field span-2"><label for="transferNote">Catatan</label><input class="control" id="transferNote" placeholder="Contoh: tambahan dana PLN"></div></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Batal</button><button class="btn btn-primary">Transfer</button></div></form>');var dest=document.getElementById('transferDestination');if(dest.options.length>1)dest.selectedIndex=1;bindMoney(document.getElementById('transferAmount'));document.getElementById('transferForm').onsubmit=function(e){e.preventDefault();setModalBusy(true);aioRun().withSuccessHandler(saved('Transfer rekening berhasil.')).withFailureHandler(onError).createAccountTransfer({sourceAccount:val('transferSource'),destinationAccount:val('transferDestination'),amount:rawMoney(val('transferAmount')),note:val('transferNote')});};}
    function openReconcileModal(){openModal('<div class="modal-head"><h2>Rekonsiliasi saldo</h2><button class="close" data-close aria-label="Tutup">×</button></div><form id="reconcileForm"><div class="modal-body"><div class="form-grid"><div class="field span-2"><label for="reconcileAccount">Rekening</label><select class="control" id="reconcileAccount">'+accountOptions('')+'</select></div><div class="field span-2"><label for="actualBalance">Saldo aktual bank/amplop</label><input class="control" id="actualBalance" inputmode="numeric" required></div><div class="field span-2"><label for="reconcileNote">Alasan penyesuaian</label><input class="control" id="reconcileNote" placeholder="Contoh: saldo awal per 1 Agustus"></div><p class="span-2 muted">Selisih dicatat sebagai Penyesuaian, bukan pemasukan atau pengeluaran operasional.</p></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Batal</button><button class="btn btn-primary">Simpan rekonsiliasi</button></div></form>');bindMoney(document.getElementById('actualBalance'));document.getElementById('reconcileForm').onsubmit=function(e){e.preventDefault();setModalBusy(true);aioRun().withSuccessHandler(saved('Saldo rekening sudah direkonsiliasi.')).withFailureHandler(onError).reconcileAccount({accountId:val('reconcileAccount'),actualBalance:rawMoney(val('actualBalance')),note:val('reconcileNote')});};}
    function openRuleModal(rule){if(!rule)return;openModal('<div class="modal-head"><h2>Atur '+esc(accountName(rule.accountId))+'</h2><button class="close" data-close aria-label="Tutup">×</button></div><form id="ruleForm"><div class="modal-body"><div class="form-grid"><div class="field span-2"><label for="ruleMethod">Metode</label><select class="control" id="ruleMethod"><option '+(rule.method==='Target Nominal'?'selected':'')+'>Target Nominal</option><option '+(rule.method==='Persentase'?'selected':'')+'>Persentase</option><option '+(rule.method==='Sisa'?'selected':'')+'>Sisa</option></select></div><div class="field"><label for="ruleValue">Nilai target / persen</label><input class="control" id="ruleValue" inputmode="numeric" value="'+numberFormat(rule.value)+'"></div><div class="field"><label for="ruleDue">Tanggal jatuh tempo</label><input class="control" id="ruleDue" type="number" min="1" max="31" value="'+rule.dueDay+'"></div><div class="field span-2"><label for="rulePriority">Prioritas</label><input class="control" id="rulePriority" type="number" min="1" value="'+rule.priority+'"></div></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Batal</button><button class="btn btn-primary">Simpan aturan</button></div></form>');bindMoney(document.getElementById('ruleValue'));document.getElementById('ruleForm').onsubmit=function(e){e.preventDefault();setModalBusy(true);aioRun().withSuccessHandler(saved('Aturan alokasi diperbarui.')).withFailureHandler(onError).saveAllocationRule({id:rule.id,method:val('ruleMethod'),value:rawMoney(val('ruleValue')),dueDay:Number(val('ruleDue')),priority:Number(val('rulePriority')),active:true});};}
    function openBudgetModal(b){b=b||{};openModal('<div class="modal-head"><h2>'+(b.id?'Perbarui target':'Buat target budget')+'</h2><button class="close" data-close aria-label="Tutup">×</button></div><form id="budgetForm"><div class="modal-body"><div class="form-grid"><div class="field span-2"><label for="budgetName">Nama target</label><input class="control" id="budgetName" value="'+attr(b.name||'')+'" required placeholder="Contoh: Renovasi toko"></div><div class="field"><label for="budgetTarget">Nominal target</label><input class="control" id="budgetTarget" value="'+(b.target?numberFormat(b.target):'')+'" required inputmode="numeric"></div><div class="field"><label for="budgetSaved">Sudah terkumpul</label><input class="control" id="budgetSaved" value="'+(b.saved?numberFormat(b.saved):'')+'" inputmode="numeric"></div><div class="field span-2"><label for="budgetDeadline">Deadline</label><input class="control" id="budgetDeadline" type="date" value="'+attr(b.deadline||'')+'" required></div><div class="field span-2"><label for="budgetNote">Catatan</label><textarea class="control" id="budgetNote">'+esc(b.note||'')+'</textarea></div></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Batal</button><button class="btn btn-primary">Simpan target</button></div></form>');bindMoney(document.getElementById('budgetTarget'));bindMoney(document.getElementById('budgetSaved'));document.getElementById('budgetForm').onsubmit=function(e){e.preventDefault();setModalBusy(true);aioRun().withSuccessHandler(saved('Target budget disimpan.')).withFailureHandler(onError).saveBudget({id:b.id||'',name:val('budgetName'),target:rawMoney(val('budgetTarget')),saved:rawMoney(val('budgetSaved')),deadline:val('budgetDeadline'),note:val('budgetNote')});};}
    function openInvoiceModal(){var today=state.data.today||new Date().toISOString().slice(0,10),options=supplierCategoryOptions();openModal('<div class="modal-head"><h2>Tambah tagihan supplier</h2><button class="close" data-close aria-label="Tutup">×</button></div><form id="invoiceForm"><div class="modal-body"><div class="form-grid"><div class="field span-2"><label for="invSupplier">Supplier dari kategori Pengeluaran</label><select class="control" id="invSupplier" required>'+options+'</select><small style="color:var(--muted)">Kelola nama supplier melalui menu Kategori. Subkategori cocok untuk nama supplier.</small></div><div class="field"><label for="invEmail">Email supplier</label><input class="control" id="invEmail" type="email"></div><div class="field"><label for="invDate">Tanggal invoice</label><input class="control" id="invDate" type="date" value="'+today+'" required></div><div class="field"><label for="invDue">Jatuh tempo</label><input class="control" id="invDue" type="date" required></div><div class="field span-2"><label>Item pembelian</label><div id="invoiceItems"></div><button class="btn btn-secondary" type="button" id="addItem">+ Tambah item</button></div><div class="field"><label for="invTax">Pajak (%)</label><input class="control" id="invTax" type="number" min="0" value="0"></div><div class="field"><label for="invDiscount">Diskon (Rp)</label><input class="control" id="invDiscount" inputmode="numeric" value="0"></div><div class="field span-2"><label for="invNote">Catatan</label><textarea class="control" id="invNote"></textarea></div><div class="span-2 invoice-summary" id="invoiceSummary"></div></div></div><div class="modal-foot"><button type="button" class="btn btn-secondary" data-close>Batal</button><button class="btn btn-primary" '+(options?'':'disabled')+'>Simpan tagihan</button></div></form>','wide');document.getElementById('addItem').onclick=addInvoiceItem;document.getElementById('invTax').oninput=calcInvoice;bindMoney(document.getElementById('invDiscount'));document.getElementById('invDiscount').addEventListener('input',calcInvoice);addInvoiceItem();document.getElementById('invoiceForm').onsubmit=submitInvoice;}
    function supplierCategoryOptions(){var cats=state.data.categories.filter(function(c){return c.type==='Pengeluaran'&&c.active;});var parents=cats.filter(function(c){return !c.parent;});return parents.map(function(parent){var children=cats.filter(function(c){return c.parent===parent.name;});return'<option value="'+esc(parent.id)+'">'+esc(parent.name)+'</option>'+children.map(function(child){return'<option value="'+esc(child.id)+'">'+esc(parent.name+' / '+child.name)+'</option>';}).join('');}).join('');}
    function addInvoiceItem(){var row=document.createElement('div');row.className='item-row';row.innerHTML='<input class="control item-name" placeholder="Nama item" required><input class="control item-qty" type="number" min="1" value="1" aria-label="Jumlah"><input class="control item-price" inputmode="numeric" placeholder="Harga" aria-label="Harga"><button type="button" class="remove-item" aria-label="Hapus item">×</button>';document.getElementById('invoiceItems').appendChild(row);bindMoney(row.querySelector('.item-price'));row.querySelectorAll('input').forEach(function(i){i.addEventListener('input',calcInvoice);});row.querySelector('.remove-item').onclick=function(){if(document.querySelectorAll('.item-row').length>1)row.remove();calcInvoice();};calcInvoice();}
    function invoiceItems(){return Array.from(document.querySelectorAll('.item-row')).map(function(r){return{name:r.querySelector('.item-name').value,qty:Number(r.querySelector('.item-qty').value||0),price:rawMoney(r.querySelector('.item-price').value)};});}
    function calcInvoice(){var subtotal=invoiceItems().reduce(function(s,i){return s+i.qty*i.price;},0),tax=Number(val('invTax')||0),disc=rawMoney(val('invDiscount')),total=Math.max(0,subtotal+subtotal*tax/100-disc);document.getElementById('invoiceSummary').innerHTML='<div class="summary-row"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><div class="summary-row"><span>Pajak</span><span>'+money(subtotal*tax/100)+'</span></div><div class="summary-row total"><span>Total</span><span>'+money(total)+'</span></div>';}
    function submitInvoice(e){e.preventDefault();var selectedId=val('invSupplier'),selected=state.data.categories.find(function(c){return c.id===selectedId;});if(!selected){showToast('Pilih supplier dari kategori Pengeluaran.',true);return;}var supplier=selected.parent?selected.name:selected.name,category=selected.parent||selected.name,subcategory=selected.parent?selected.name:'';setModalBusy(true);aioRun().withSuccessHandler(saved('Tagihan supplier berhasil dibuat.')).withFailureHandler(onError).saveInvoice({supplier:supplier,category:category,subcategory:subcategory,email:val('invEmail'),invoiceDate:val('invDate'),dueDate:val('invDue'),items:invoiceItems(),tax:Number(val('invTax')||0),discount:rawMoney(val('invDiscount')),note:val('invNote'),status:'Draft'});}
    function changeInvoiceStatus(id,status){setLoading(true);aioRun().withSuccessHandler(saved(status==='Dibayar'?'Tagihan dibayar dan masuk ke Pengeluaran.':'Status tagihan diperbarui.')).withFailureHandler(function(err){renderInvoices();onError(err);}).updateInvoiceStatus(id,status);}
    function printInvoice(id){var i=state.data.invoices.find(function(x){return x.id===id;});if(!i)return;document.getElementById('printArea').innerHTML='<div class="print-invoice"><h1>TAGIHAN SUPPLIER</h1><p><strong>'+esc(i.number)+'</strong></p><hr><p>Supplier: <strong>'+esc(i.supplier||i.client)+'</strong><br>'+esc(i.email||'')+'</p><p>Kategori: '+esc(i.category+(i.subcategory?' / '+i.subcategory:''))+'<br>Tanggal: '+dateId(i.invoiceDate)+'<br>Jatuh tempo: '+dateId(i.dueDate)+'</p><table><thead><tr><th>Item</th><th>Jumlah</th><th>Harga</th><th>Total</th></tr></thead><tbody>'+i.items.map(function(x){return'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td></tr>';}).join('')+'</tbody></table><h2 style="text-align:right">Total: '+money(i.total)+'</h2><p>'+esc(i.note||'')+'</p></div>';window.print();}
    function openModal(html,size){state.lastFocus=document.activeElement;var root=document.getElementById('modalRoot');root.innerHTML='<div class="modal '+(size||'')+'" role="dialog" aria-modal="true">'+html+'</div>';root.classList.add('open');root.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(function(){var f=root.querySelector('input,button,select');if(f)f.focus();},20);}
    function closeModal(){var root=document.getElementById('modalRoot');if(!root.classList.contains('open'))return;root.classList.remove('open');root.setAttribute('aria-hidden','true');root.innerHTML='';document.body.style.overflow='';if(state.lastFocus)state.lastFocus.focus();}
    function trapModalFocus(e){var root=document.getElementById('modalRoot');if(!root.classList.contains('open'))return;var nodes=Array.from(root.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])'));if(!nodes.length)return;var first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    function setModalBusy(on){var b=document.querySelector('.modal-foot .btn-primary');if(b){b.disabled=on;b.textContent=on?'Menyimpan…':'Simpan';}}
    function saved(message){return function(response){var data=response;if(typeof response==='string'){try{data=JSON.parse(response);}catch(err){data=null;}}closeModal();setLoading(false);showToast(message);if(data&&typeof data==='object'){state.data=normalizeAppData(data);state.hasCache=true;writeCache(state.data);renderAll();setSyncStatus('online','Data terbaru');}else{setSyncStatus('syncing','Memuat perubahan…');loadData(true);}};}
    function transactionSaved(payload){return function(response){var data=response;if(typeof response==='string'){try{data=JSON.parse(response);}catch(err){data=null;}}var transaction=data&&data.transaction?data.transaction:{id:'LOCAL-'+Date.now(),date:payload.date,type:payload.type,amount:Number(payload.amount)||0,description:payload.description,category:payload.category,subcategory:payload.subcategory||'',method:payload.method||'Transfer',note:payload.note||'',sourceAccount:payload.type==='Pengeluaran'?payload.accountId:'',destinationAccount:payload.type==='Pemasukan'?payload.accountId:'',reference:'',period:'',created:''};closeModal();setModalBusy(false);setLoading(false);state.data.transactions=(state.data.transactions||[]).filter(function(item){return item.id!==transaction.id;});state.data.transactions.unshift(transaction);state.data.transactions.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});applyTransactionBalance(transaction);state.hasCache=true;writeCache(state.data);renderAll();showToast('Transaksi berhasil disimpan.');setSyncStatus('syncing','Tersimpan · memperbarui data…');setTimeout(function(){loadData(true);},250);};}
    function applyTransactionBalance(transaction){var accountId=transaction.type==='Pemasukan'?transaction.destinationAccount:transaction.sourceAccount,account=(state.data.accounts||[]).find(function(item){return item.id===accountId;});if(!account)return;var amount=Number(transaction.amount)||0;if(transaction.type==='Pemasukan')account.balance=Number(account.balance||0)+amount;else if(transaction.type==='Pengeluaran')account.balance=Number(account.balance||0)-amount;}
    function onError(err){setLoading(false);setModalBusy(false);showToast((err&&err.message)||'Terjadi kesalahan. Silakan coba lagi.',true);}
    function setLoading(on){document.getElementById('loading').style.display=on?'grid':'none';}
    function showToast(message,isError){var t=document.getElementById('toast');t.textContent=message;t.className='toast show'+(isError?' error':'');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){t.className='toast';},3500);}
    function bindMoney(el){el.addEventListener('input',function(){var n=rawMoney(el.value);el.value=n?numberFormat(n):'';});}
    function rawMoney(v){return Number(String(v||'').replace(/[^0-9]/g,''))||0;}
    function numberFormat(n){return new Intl.NumberFormat('id-ID').format(n||0);}
    function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);}
    function dateId(s){if(!s)return'—';var p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
    function daysLabel(date){var today=new Date();today.setHours(0,0,0,0);var d=new Date(date+'T00:00:00');var days=Math.ceil((d-today)/86400000);return days<0?'Lewat '+Math.abs(days)+' hari':days===0?'Hari ini':days+' hari lagi';}
    function percent(a,b){return Math.min(100,Math.max(0,Math.round((a/(b||1))*100)));}
    function categoryPath(transaction){return transaction.category+(transaction.subcategory?' / '+transaction.subcategory:'');}
    function accountName(id){var a=(state.data.accounts||[]).find(function(item){return item.id===id;});return a?a.name:(id||'—');}
    function accountOptions(selected){return(state.data.accounts||[]).filter(function(a){return a.active!==false;}).map(function(a){return'<option value="'+esc(a.id)+'" '+(a.id===selected?'selected':'')+'>'+esc(a.name)+' · '+money(a.balance)+'</option>';}).join('');}
    function transactionAccountPath(t){if(t.type==='Transfer')return accountName(t.sourceAccount)+' → '+accountName(t.destinationAccount);return accountName(t.sourceAccount||t.destinationAccount);}
    function val(id){var el=document.getElementById(id);return el?el.value:'';}
    function esc(v){var d=document.createElement('div');d.textContent=String(v==null?'':v);return d.innerHTML;}
    function attr(v){return esc(v).replace(/"/g,'&quot;');}
    function empty(text){return'<div class="empty"><div class="avatar">·</div>'+esc(text)+'</div>';}
  </script>
